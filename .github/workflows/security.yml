name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a dependency that was clean at merge time can become vulnerable later.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the job on a high or critical advisory. Moderate ones are reported
      # by Dependabot but do not block a release.
      - name: pnpm audit
        run: pnpm audit --audit-level high

      # The only moment the licence of a runtime dependency can actually be
      # reviewed is the commit that adds it. After that it ships to every
      # consumer and nobody looks again. The allowlist is deliberately a list
      # of three names rather than a licence scanner: `pnpm licenses --prod`
      # is useless here, because pnpm auto-installs the peers and writes them
      # into importers['.'].dependencies, so it reports payload, @payloadcms/*
      # and react as if they were ours.
      - name: Guard - runtime dependency allowlist
        run: |
          node -e '
            const allowed = new Set(["@dnd-kit/core", "@dnd-kit/sortable", "@dnd-kit/utilities"]);
            const deps = Object.keys(require("./package.json").dependencies || {});
            const extra = deps.filter((d) => !allowed.has(d));
            if (extra.length) {
              console.log("::error::New runtime dependency: " + extra.join(", ") + ". Every runtime dependency ships to consumers: check its licence (and its transitive tree) and add it to the allowlist in .github/workflows/security.yml plus the disclosure in README.md, in this same commit.");
              process.exit(1);
            }
          '

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits, not just the worktree.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
